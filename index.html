<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧社区 · 原型演示 v1.0</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    background: #f2f5fa; color: #1f2430; min-height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  /* ---------- 顶栏 ---------- */
  .topbar {
    height: 52px; flex-shrink: 0; display: flex; align-items: center; padding: 0 22px;
    background: linear-gradient(90deg, #4361ee, #3a0ca3); color: #fff;
  }
  .topbar .logo { font-size: 18px; margin-right: 10px; }
  .topbar .title { font-size: 15px; font-weight: 700; }
  .topbar .ver { margin-left: 10px; font-size: 11px; opacity: .75; }
  .topbar .links { margin-left: auto; display: flex; gap: 16px; font-size: 12px; }
  .topbar .links a { color: rgba(255,255,255,.88); text-decoration: none; }
  .topbar .links a:hover { color: #fff; text-decoration: underline; }

  .layout { flex: 1; display: flex; min-height: 0; }

  /* ---------- 左侧目录 ---------- */
  .side-left {
    width: 220px; flex-shrink: 0; background: #fff; border-right: 1px solid #e8ecf3;
    padding: 14px 12px; overflow-y: auto;
  }
  .group-name { font-size: 11px; color: #a0a6b5; margin: 14px 6px 6px; }
  .group-name:first-child { margin-top: 2px; }
  .nav-item {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px;
    font-size: 13px; color: #4a5162; cursor: pointer; transition: all .12s;
  }
  .nav-item:hover { background: #f0f4ff; color: #4361ee; }
  .nav-item.active { background: #eef2ff; color: #3a0ca3; font-weight: 600; }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: #c9d2e8; flex-shrink: 0; }
  .nav-item.active .dot { background: #4361ee; }

  /* ---------- 中间舞台 ---------- */
  .stage {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; padding: 24px 12px; min-width: 0;
  }
  .caption { margin-top: 16px; font-size: 12.5px; color: #7c8497; text-align: center; max-width: 420px; }
  .caption b { color: #3a0ca3; }

  /* ---------- 右侧说明 ---------- */
  .side-right {
    width: 250px; flex-shrink: 0; background: #fff; border-left: 1px solid #e8ecf3;
    padding: 18px 16px; overflow-y: auto;
  }
  .note-title { font-size: 14px; font-weight: 700; color: #3a0ca3; margin-bottom: 10px; }
  .note-point { font-size: 12.5px; color: #5b6273; line-height: 1.75; margin-bottom: 6px; padding-left: 14px; position: relative; }
  .note-point::before { content: ''; position: absolute; left: 0; top: 9px; width: 5px; height: 5px; border-radius: 50%; background: #4361ee; }
  .note-divider { border: none; border-top: 1px dashed #e3e7f0; margin: 14px 0; }
  .note-link { font-size: 12px; color: #4361ee; text-decoration: none; }
  .note-link:hover { text-decoration: underline; }

  /* ---------- 手机外壳 ---------- */
  .phone {
    width: 375px; height: 760px; background: #f4f6fb; border-radius: 40px;
    box-shadow: 0 24px 60px rgba(31,36,48,.25), 0 0 0 10px #1f2430, 0 0 0 12px #3a4050;
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    font-size: 14px; line-height: 1.6;
  }
  .statusbar {
    height: 40px; flex-shrink: 0; display: flex; align-items: center;
    justify-content: space-between; padding: 0 22px; font-size: 12px;
    font-weight: 600; background: #4361ee; color: #fff; z-index: 5;
  }
  .navbar {
    height: 44px; flex-shrink: 0; background: #4361ee; color: #fff; position: relative;
    display: flex; align-items: center; justify-content: center;
    font-size: 15.5px; font-weight: 600; z-index: 5;
  }
  .nav-back {
    position: absolute; left: 12px; top: 0; bottom: 0; display: flex; align-items: center;
    font-size: 13px; font-weight: 400; cursor: pointer; opacity: .95;
  }
  .screen { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
  .screen::-webkit-scrollbar { width: 0; }

  .tabbar {
    height: 52px; flex-shrink: 0; background: #fff; border-top: 1px solid #f0f2f7;
    display: flex; z-index: 10;
  }
  .tabbar.hidden { display: none; }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; padding-top: 6px;
    font-size: 10.5px; color: #8a90a0; cursor: pointer; gap: 1px;
  }
  .tab-item .ti { font-size: 19px; line-height: 1; filter: grayscale(1); opacity: .55; }
  .tab-item.active { color: #4361ee; font-weight: 600; }
  .tab-item.active .ti { filter: none; opacity: 1; }

  /* ---------- 通用（源自 app.wxss，rpx÷2） ---------- */
  .page { padding: 12px 12px 24px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(31,36,48,.06); overflow: hidden; }
  .card + .card { margin-top: 12px; }
  .card-hd { display: flex; align-items: center; justify-content: space-between; padding: 13px 14px 0; font-size: 15px; font-weight: 600; }
  .card-bd { padding: 10px 14px 14px; }
  .row { display: flex; align-items: center; }
  .between { justify-content: space-between; }
  .flex1 { flex: 1; min-width: 0; }
  .mt8 { margin-top: 4px; } .mt24 { margin-top: 12px; }
  .subtitle { font-size: 14px; font-weight: 600; }
  .muted { color: #8a90a0; font-size: 12px; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clamp2 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; line-height: 1.6; white-space: nowrap; }
  .tag-warn { background: #fff3e0; color: #e08600; }
  .tag-info { background: #e8f0ff; color: #4361ee; }
  .tag-ok { background: #e6f7ef; color: #12a05c; }
  .tag-danger { background: #ffecec; color: #e63946; }
  .tag-gray { background: #f0f2f7; color: #8a90a0; }
  .btn { display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 999px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .btn-primary { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; box-shadow: 0 4px 10px rgba(67,97,238,.28); }
  .btn-ghost { background: #eef2ff; color: #4361ee; }
  .btn-danger { background: #ffecec; color: #e63946; }
  .btn-sm { height: 30px; padding: 0 14px; font-size: 12px; }
  .btn-block { width: 100%; }
  .input, textarea.input {
    width: 100%; background: #fbfcfe; border: 1px solid #e6e9f0; border-radius: 8px;
    padding: 10px 12px; font-size: 14px; color: #1f2430; outline: none; font-family: inherit;
  }
  textarea.input { resize: none; }
  .input::placeholder { color: #b6bcc9; }
  .form-item { margin-bottom: 13px; }
  .label { font-size: 13px; color: #5b6273; margin-bottom: 6px; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #7b8cff, #4361ee); color: #fff;
    font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center;
  }
  .avatar-lg { width: 58px; height: 58px; font-size: 23px; }
  .fab {
    position: absolute; right: 18px; bottom: 66px; width: 50px; height: 50px; border-radius: 50%;
    background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; font-size: 24px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 15px rgba(67,97,238,.4); cursor: pointer; z-index: 20;
  }
  .filters { display: flex; background: #fff; border-radius: 999px; padding: 4px; margin-bottom: 12px; box-shadow: 0 4px 15px rgba(31,36,48,.06); }
  .filter { flex: 1; text-align: center; padding: 7px 0; border-radius: 999px; font-size: 13px; color: #6b7280; cursor: pointer; }
  .filter.active { background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; font-weight: 600; }
  .end-tip { text-align: center; color: #a0a6b5; font-size: 12px; padding: 15px 0; }

  /* ---------- 首页 ---------- */
  .home { padding-top: 0; }
  .hero {
    margin: 0 -12px; padding: 16px 20px 48px; color: #fff;
    background: linear-gradient(140deg, #4361ee 0%, #3a0ca3 100%);
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
  }
  .hello { font-size: 19px; font-weight: 700; }
  .room { margin-top: 4px; font-size: 12px; color: rgba(255,255,255,.72); }
  .hero .avatar { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4); }
  .hero-panel {
    margin-top: 16px; padding: 14px 16px; border-radius: 12px;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.25);
    display: flex; align-items: center;
  }
  .biz-tip {
    margin-top: -32px; position: relative; z-index: 2; display: flex; align-items: center;
    padding: 15px 16px; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(31,36,48,.06);
  }
  .grid { display: flex; flex-wrap: wrap; padding: 16px 0 10px; }
  .grid-item { width: 25%; display: flex; flex-direction: column; align-items: center; margin-bottom: 16px; cursor: pointer; }
  .grid-icon { width: 46px; height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 21px; }
  .grid-text { margin-top: 6px; font-size: 12px; color: #4a5162; }
  .footer-tip { margin-top: 20px; text-align: center; font-size: 11px; color: #aab0bf; }

  /* ---------- 报修/账单 ---------- */
  .repair, .bill { padding: 14px; }
  .repair + .repair, .bill + .bill { margin-top: 10px; }
  .desc { margin-top: 6px; font-size: 13px; color: #5b6273; line-height: 1.6; }
  .images { display: flex; flex-wrap: wrap; margin-top: 8px; }
  .img-ph {
    width: 76px; height: 76px; border-radius: 8px; margin: 0 6px 6px 0; font-size: 26px;
    background: linear-gradient(135deg,#e8ecf5,#dfe4ef); display: flex; align-items: center; justify-content: center;
  }
  .summary { padding: 18px 16px; border-radius: 12px; background: linear-gradient(135deg, #4361ee, #3a0ca3); color: #fff; box-shadow: 0 8px 18px rgba(67,97,238,.28); }
  .summary-label { font-size: 12px; color: rgba(255,255,255,.78); }
  .summary-amount { margin-top: 4px; font-size: 32px; font-weight: 700; line-height: 1.1; }
  .summary-icon { font-size: 36px; opacity: .9; }
  .summary-tip { margin-top: 8px; font-size: 11px; color: rgba(255,255,255,.65); }
  .bill-right { text-align: right; margin-left: 10px; }
  .bill-money { font-size: 18px; font-weight: 700; margin-bottom: 5px; }
  .bill-action { display: flex; justify-content: flex-end; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f2f7; }
  .help { margin-top: 20px; text-align: center; font-size: 12px; color: #8a90a0; text-decoration: underline; }

  /* ---------- 时间线 ---------- */
  .timeline { padding: 6px 0 2px; }
  .tl-item { display: flex; }
  .tl-left { display: flex; flex-direction: column; align-items: center; width: 20px; flex-shrink: 0; }
  .tl-dot { width: 10px; height: 10px; border-radius: 50%; background: #c9d2e8; margin-top: 4px; }
  .tl-item.done .tl-dot { background: #12a05c; }
  .tl-item.now .tl-dot { background: #4361ee; box-shadow: 0 0 0 4px rgba(67,97,238,.18); }
  .tl-line { width: 2px; flex: 1; background: #e3e7f0; margin: 2px 0; }
  .tl-body { flex: 1; padding: 0 0 18px 12px; font-size: 13px; }
  .tl-title { font-weight: 600; }
  .tl-time { font-size: 11.5px; color: #a0a6b5; margin-top: 2px; }

  /* ---------- 论坛 ---------- */
  .post { padding: 14px; }
  .post + .post { margin-top: 10px; }
  .post-title { font-size: 14.5px; font-weight: 600; }
  .post-body { margin-top: 6px; font-size: 13px; color: #5b6273; line-height: 1.65; }
  .post-foot { display: flex; align-items: center; margin-top: 10px; font-size: 12px; color: #8a90a0; }
  .post-foot .like { cursor: pointer; margin-left: auto; }
  .reply-item { padding: 10px 0; border-top: 1px solid #f2f4f8; }
  .reply-input { display: flex; gap: 8px; margin-top: 12px; }
  .reply-input .input { flex: 1; }

  /* ---------- 我的 ---------- */
  .mine { padding-top: 0; }
  .profile {
    margin: 0 -12px 12px; padding: 20px 20px 16px; color: #fff;
    background: linear-gradient(140deg, #4361ee 0%, #3a0ca3 100%);
    border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;
  }
  .profile-avatar { background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.4); position: relative; cursor: pointer; }
  .avatar-badge {
    position: absolute; right: -1px; bottom: -1px; width: 19px; height: 19px; border-radius: 50%;
    background: #fff; border: 1.5px solid #4361ee; font-size: 10px;
    display: flex; align-items: center; justify-content: center; z-index: 3;
  }
  .profile-name { font-size: 19px; font-weight: 700; }
  .profile-sub { margin-top: 3px; font-size: 12px; color: rgba(255,255,255,.75); }
  .edit-btn { padding: 5px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); font-size: 12px; cursor: pointer; }
  .profile-stats { display: flex; margin-top: 18px; padding: 12px 0; border-radius: 10px; background: rgba(255,255,255,.14); }
  .pstat { flex: 1; text-align: center; }
  .pstat-n { font-size: 19px; font-weight: 700; }
  .pstat-l { margin-top: 2px; font-size: 11px; color: rgba(255,255,255,.72); }
  .menu { display: flex; align-items: center; padding: 15px 14px; border-bottom: 1px solid #f2f4f8; cursor: pointer; }
  .menu:last-child { border-bottom: none; }
  .menu-icon { font-size: 17px; margin-right: 10px; }
  .menu-text { flex: 1; font-size: 14px; color: #2c3240; }
  .menu-arrow { color: #c2c8d4; font-size: 17px; }
  .version { margin: 20px 0 10px; text-align: center; font-size: 11px; color: #b0b6c4; }

  /* ---------- 登录 ---------- */
  .login-wrap {
    min-height: 100%; padding: 0 24px; display: flex; flex-direction: column;
    background: linear-gradient(160deg, #4361ee 0%, #3a0ca3 55%, #2b0a78 100%);
  }
  .brand { padding: 54px 0 28px; text-align: center; color: #fff; }
  .brand-logo { font-size: 48px; line-height: 1; margin-bottom: 12px; }
  .brand-name { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
  .brand-sub { margin-top: 6px; font-size: 12px; color: rgba(255,255,255,.75); letter-spacing: 2px; }
  .login-card { border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); background: #fff; }
  .tabs { display: flex; border-bottom: 1px solid #eef0f5; }
  .tab { flex: 1; text-align: center; padding: 14px 0; font-size: 15px; color: #8a90a0; position: relative; cursor: pointer; }
  .tab.active { color: #4361ee; font-weight: 600; }
  .tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 32px; height: 3px; border-radius: 3px; background: linear-gradient(90deg, #4361ee, #f72585); }
  .hint { margin-top: 12px; text-align: center; font-size: 12px; color: #a0a6b5; }
  .server { margin-top: auto; padding: 22px 0 28px; text-align: center; font-size: 11px; color: rgba(255,255,255,.65); }

  /* ---------- 服务/活动 ---------- */
  .svc { padding: 14px; display: flex; align-items: center; }
  .svc + .svc { margin-top: 10px; }
  .svc-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 21px; margin-right: 12px; flex-shrink: 0; }
  .svc-price { color: #e63946; font-weight: 700; font-size: 15px; }
  .act { padding: 14px; }
  .act + .act { margin-top: 10px; }

  /* ---------- 公告 ---------- */
  .notice-item { padding: 14px; cursor: pointer; }
  .notice-item + .notice-item { margin-top: 10px; }
  .notice-content { padding: 16px; font-size: 13.5px; line-height: 1.9; color: #3c4354; }
  .notice-foot { padding: 12px 16px; border-top: 1px solid #f2f4f8; font-size: 11px; color: #a0a6b5; }

  /* ---------- toast ---------- */
  .toast {
    position: fixed; left: 50%; top: 46%; transform: translate(-50%,-50%);
    background: rgba(31,36,48,.88); color: #fff; font-size: 13.5px;
    padding: 11px 22px; border-radius: 10px; z-index: 999; opacity: 0;
    transition: opacity .2s; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 960px) {
    .side-right { display: none; }
  }
  @media (max-width: 700px) {
    .side-left { display: none; }
    .phone { transform: scale(.9); }
  }
</style>
</head>

/* ==================== 工具 ==================== */
let history = [];
let current = 'login';
let currentPostId = 1;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1500);
}
function statusTag(s) {
  return { '待处理': 'tag-warn', '处理中': 'tag-info', '已完成': 'tag-ok', '已拒绝': 'tag-danger',
           '未缴费': 'tag-warn', '已缴费': 'tag-ok', '待审批': 'tag-warn', '已批准': 'tag-ok',
           '待回复': 'tag-warn', '已回复': 'tag-ok' }[s] || 'tag-gray';
}
function imgPh(n) {
  let h = '';
  for (let i = 0; i < n; i++) h += '<div class="img-ph">🖼</div>';
  return h ? '<div class="images">' + h + '</div>' : '';
}

    const list = bills.filter(b => billFilter === '全部' || b.status === billFilter);
    return `
    <div class="page">
      <div class="summary">
        <div class="row between">
          <div>
            <div class="summary-label">待缴总额（元）</div>
            <div class="summary-amount">${unpaidSum.toFixed(2)}</div>
          </div>
          <div class="summary-icon">💰</div>
        </div>
        <div class="summary-tip">缴费问题请联系物业服务中心</div>
      </div>
      <div class="filters" style="margin:12px 0;">
        ${['全部','未缴费','已缴费'].map(f =>
          `<div class="filter${f===billFilter?' active':''}" onclick="billFilter='${f}';rerender()">${f}</div>`).join('')}
      </div>
      ${list.map(b => `
      <div class="card bill">
        <div class="row between">
          <div class="flex1">
            <div class="subtitle">${b.type}</div>
            <div class="muted mt8">创建于 ${b.create}</div>
            ${b.payTime ? `<div class="muted">缴费时间 ${b.payTime}</div>` : ''}
          </div>
          <div class="bill-right">
            <div class="bill-money">¥ ${b.money.toFixed(2)}</div>
            <div class="tag ${statusTag(b.status)}">${b.status}</div>
          </div>
        </div>
        ${b.status === '未缴费' ? `<div class="bill-action"><div class="btn btn-primary btn-sm" onclick="payBill(${b.id})">去缴费</div></div>` : ''}
      </div>`).join('')}
      <div class="help" onclick="toast('拨打物业电话 029-8888xxxx')">账单有疑问？拨打物业电话</div>
    </div>`;
  },

  forum: () => `
    <div class="page">
      ${posts.map(p => `
      <div class="card post">
        <div class="row">
          <div class="avatar">${p.user[0]}</div>
          <div style="margin-left:10px;" class="flex1">
            <div style="font-size:13px;font-weight:600;">${p.user}</div>
            <div class="muted">${p.time}</div>
          </div>
        </div>
        <div style="cursor:pointer;" onclick="currentPostId=${p.id};go('postDetail')">
          <div class="post-title" style="margin-top:10px;">${p.title}</div>
          <div class="post-body clamp2">${p.content}</div>
        </div>
        <div class="post-foot">
          <span>💬 ${p.replies.length} 条回复</span>
          <span class="like" onclick="toggleLike(${p.id})">${p.liked ? '❤️' : '🤍'} ${p.likes}</span>
        </div>
      </div>`).join('')}
      <div class="end-tip">— 没有更多了 —</div>
    </div>
    <div class="fab" onclick="go('postCreate')">＋</div>`,

  postDetail: () => {
    const p = posts.find(x => x.id === currentPostId) || posts[0];
    return `
    <div class="page">
      <div class="card post">
        <div class="row">
          <div class="avatar">${p.user[0]}</div>
          <div style="margin-left:10px;" class="flex1">
            <div style="font-size:13px;font-weight:600;">${p.user}</div>
            <div class="muted">${p.time}</div>
          </div>
          <span class="like" style="cursor:pointer;font-size:13px;" onclick="toggleLike(${p.id})">${p.liked ? '❤️' : '🤍'} ${p.likes}</span>
        </div>
        <div class="post-title" style="margin-top:12px;">${p.title}</div>
        <div class="post-body">${p.content}</div>
      </div>
      <div class="card">
        <div class="card-hd"><span>全部回复（${p.replies.length}）</span></div>
        <div class="card-bd">
          ${p.replies.map(r => `
          <div class="reply-item">
            <div class="row"><div class="avatar" style="width:28px;height:28px;font-size:12px;">${r.user[0]}</div>
            <span style="margin-left:8px;font-size:12.5px;font-weight:600;">${r.user}</span></div>
            <div style="font-size:13px;color:#3c4354;margin-top:6px;">${r.content}</div>
          </div>`).join('')}
          <div class="reply-input">
            <input class="input" id="replyText" placeholder="友善回复，温暖邻里">
            <div class="btn btn-primary btn-sm" style="height:40px;" onclick="sendReply()">发送</div>
          </div>
        </div>
      </div>
    </div>`;
  },

  postCreate: () => `
    <div class="page">
      <div class="card"><div class="card-bd" style="padding-top:14px;">
        <div class="form-item"><div class="label">帖子标题</div><input class="input" id="ptTitle" placeholder="一句话说明主题"></div>
        <div class="form-item"><div class="label">正文内容</div><textarea class="input" id="ptContent" rows="6" placeholder="分享社区生活、闲置转让、求助打听…"></textarea></div>
        <div class="form-item">
          <div class="label">配图（可选）</div>
          <div class="images"><div class="img-ph" style="border:1px dashed #c2c8d4;background:#fbfcfe;color:#a0a6b5;cursor:pointer;" onclick="toast('打开相册/拍照')">＋</div></div>
        </div>
        <div class="btn btn-primary btn-block" onclick="submitPost()">发 布</div>
      </div></div>
    </div>`,

  service: () => `
    <div class="page">
      ${services.map(s => `
      <div class="card svc">
        <div class="svc-icon" style="background:${s.bg}">${s.icon}</div>
        <div class="flex1">
          <div class="subtitle">${s.name}</div>
          <div class="muted mt8">${s.desc}</div>
          <div class="svc-price mt8">¥ ${s.price}.00 起</div>
        </div>
        <div class="btn btn-primary btn-sm" onclick="go('serviceBook')">预约</div>
      </div>`).join('')}
      <div class="end-tip">服务由物业合作商提供，费用线上缴纳</div>
    </div>`,

  serviceBook: () => `
    <div class="page">
      <div class="card"><div class="card-bd" style="padding-top:14px;">
        <div class="form-item"><div class="label">服务项目</div><input class="input" value="日常保洁（2小时）· ¥88" readonly></div>
        <div class="form-item"><div class="label">期望日期</div><input class="input" type="date" value="2026-10-30"></div>
        <div class="form-item"><div class="label">时间段</div>
          <div class="filters" style="margin:0;">
            <div class="filter active">上午 9-12</div><div class="filter">下午 14-17</div><div class="filter">晚上 18-20</div>
          </div>
        </div>
        <div class="form-item"><div class="label">备注</div><textarea class="input" rows="3" placeholder="如：家里有宠物、需要带梯子等"></textarea></div>
        <div class="btn btn-primary btn-block" onclick="toast('预约成功，已生成账单');go('bill',true)">提交预约</div>
      </div></div>
    </div>`,

  activity: () => `
    <div class="page">
      ${activities.map(a => `
      <div class="card act">
        <div class="row between">
          <div class="flex1">
            <div class="subtitle">${a.name}</div>
            <div class="muted mt8">活动日期 ${a.date} · 已报名 ${a.count} 人</div>
          </div>
          <div class="${a.signed ? 'btn btn-ghost' : 'btn btn-primary'} btn-sm" onclick="toggleAct(${a.id})">${a.signed ? '已报名 · 取消' : '立即报名'}</div>
        </div>
      </div>`).join('')}
      <div class="end-tip">更多活动筹备中，敬请期待</div>
    </div>`,

  notice: () => `
    <div class="page">
      ${notices.map(n => `
      <div class="card notice-item" onclick="go('noticeDetail')">
        <div class="subtitle clamp2">${n.title}</div>
        <div class="muted mt8">发布时间 ${n.time}</div>
      </div>`).join('')}
    </div>`,

  noticeDetail: () => `
    <div class="page">
      <div class="card">
        <div class="card-bd" style="padding-top:16px;">
          <div style="font-size:17px;font-weight:700;line-height:1.5;">${notices[0].title}</div>
          <div class="muted" style="margin-top:8px;">${notices[0].time}</div>
        </div>
        <div class="notice-content">${notices[0].content.replace(/\n/g, '<br>')}</div>
        <div class="notice-foot">智慧社区服务平台 · 物业服务中心发布</div>
      </div>
    </div>`,

  decoration: () => `
    <div class="page">
      <div class="card"><div class="card-bd" style="padding-top:14px;">
        <div class="subtitle" style="margin-bottom:10px;">新增装修申请</div>
        <div class="form-item"><div class="label">计划开工日期</div><input class="input" type="date" id="dcDate" value="2026-11-10"></div>
        <div class="form-item"><div class="label">装修内容说明</div><textarea class="input" id="dcContent" rows="3" placeholder="施工项目、周期、每日施工时段等"></textarea></div>
        <div class="btn btn-primary btn-block" onclick="submitDeco()">提交申请</div>
      </div></div>
      <div class="card">
        <div class="card-hd"><span>我的申请（${decorations.length}）</span></div>
        <div class="card-bd">
          ${decorations.map(d => `
          <div style="padding:10px 0;border-top:1px solid #f2f4f8;">
            <div class="row between">
              <span style="font-size:13.5px;font-weight:600;">开工日期 ${d.date}</span>
              <span class="tag ${statusTag(d.status)}">${d.status}</span>
            </div>
            <div class="desc clamp2">${d.content}</div>
          </div>`).join('')}
        </div>
      </div>
    </div>`,

  feedback: () => `
    <div class="page">
      <div class="card"><div class="card-bd" style="padding-top:14px;">
        <div class="subtitle" style="margin-bottom:10px;">我要反馈</div>
        <div class="form-item"><textarea class="input" id="fbContent" rows="3" placeholder="请输入您的投诉或建议，物业将在 24 小时内响应"></textarea></div>
        <div class="btn btn-primary btn-block" onclick="submitFeedback()">提交反馈</div>
      </div></div>
      ${feedbacks.map(f => `
      <div class="card" style="padding:14px;">
        <div class="row between">
          <span class="muted">${f.time}</span>
          <span class="tag ${statusTag(f.status)}">${f.status}</span>
        </div>
        <div class="desc">${f.content}</div>
        ${f.reply ? `
        <div style="margin-top:10px;padding:10px 12px;background:#f6f8ff;border-radius:8px;">
          <div style="font-size:12px;color:#4361ee;font-weight:600;">物业回复</div>
          <div style="font-size:13px;color:#3c4354;margin-top:4px;line-height:1.6;">${f.reply}</div>
        </div>` : ''}
      </div>`).join('')}
    </div>`,

  mine: () => `
    <div class="page mine">
      <div class="profile">
        <div class="row">
          <div class="avatar avatar-lg profile-avatar" onclick="toast('选择头像：拍照 / 从相册选择')">
            ${USER.name[0].toUpperCase()}<div class="avatar-badge">📷</div>
          </div>
          <div class="flex1" style="margin-left:12px;">
            <div class="profile-name">${USER.name}</div>
            <div class="profile-sub">房号 ${USER.room} · ${USER.phone}</div>
          </div>
          <div class="edit-btn" onclick="go('profile')">修改</div>
        </div>
        <div class="profile-stats">
          <div class="pstat"><div class="pstat-n">${repairs.filter(r=>r.status==='待处理').length}</div><div class="pstat-l">待处理报修</div></div>
          <div class="pstat"><div class="pstat-n">${bills.filter(b=>b.status==='未缴费').length}</div><div class="pstat-l">未缴账单</div></div>
          <div class="pstat"><div class="pstat-n">2</div><div class="pstat-l">我的帖子</div></div>
          <div class="pstat"><div class="pstat-n">${activities.filter(a=>a.signed).length}</div><div class="pstat-l">报名活动</div></div>
        </div>
      </div>
      <div class="card">
        <div class="menu" onclick="go('repair')"><span class="menu-icon">🔧</span><span class="menu-text">我的报修</span><span class="menu-arrow">›</span></div>
        <div class="menu" onclick="go('bill')"><span class="menu-icon">💰</span><span class="menu-text">我的账单</span><span class="menu-arrow">›</span></div>
        <div class="menu" onclick="go('service')"><span class="menu-icon">🛠</span><span class="menu-text">上门服务</span><span class="menu-arrow">›</span></div>
        <div class="menu" onclick="go('activity')"><span class="menu-icon">🎉</span><span class="menu-text">社区活动</span><span class="menu-arrow">›</span></div>
        <div class="menu" onclick="go('decoration')"><span class="menu-icon">🏠</span><span class="menu-text">装修申请</span><span class="menu-arrow">›</span></div>
        <div class="menu" onclick="go('feedback')"><span class="menu-icon">📝</span><span class="menu-text">投诉建议</span><span class="menu-arrow">›</span></div>
      </div>
      <div class="card">
        <div class="menu" onclick="toast('拨打物业电话 029-8888xxxx')"><span class="menu-icon">📞</span><span class="menu-text">联系物业</span><span class="menu-arrow">›</span></div>
      </div>
      <div class="btn btn-danger btn-block mt24" onclick="go('login',true)">退出登录</div>
      <div class="version">智慧社区 · 小程序端 v1.0</div>
    </div>`,

  profile: () => `
    <div class="page">
      <div class="card"><div class="card-bd" style="padding-top:14px;">
        <div class="form-item"><div class="label">用户名</div><input class="input" value="${USER.name}" readonly style="color:#8a90a0;"></div>
        <div class="form-item"><div class="label">房号</div><input class="input" id="pfRoom" value="${USER.room}" placeholder="如 3-502"></div>
        <div class="form-item"><div class="label">手机号</div><input class="input" id="pfPhone" value="${USER.phone}" placeholder="11 位手机号"></div>
        <div class="btn btn-primary btn-block" onclick="saveProfile()">保存修改</div>
      </div></div>
    </div>`
};

/* ==================== 交互逻辑 ==================== */
function go(name, reset) {
  if (reset) history = [];
  else if (current !== name) history.push(current);
  current = name;
  rerender();
}
function goBack() {
  current = history.pop() || 'home';
  rerender();
}
function rerender() {
  document.getElementById('screen').innerHTML = R[current]();
  document.getElementById('screen').scrollTop = 0;
  document.getElementById('navTitle').textContent = TITLES[current];
  const isTab = TAB_PAGES.includes(current);
  document.getElementById('tabbar').classList.toggle('hidden', !isTab);
  document.getElementById('navBack').style.display = (isTab || current === 'login' || history.length === 0) ? 'none' : 'flex';

  document.querySelectorAll('.tab-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === current));
  document.querySelectorAll('.side-left .nav-item').forEach(el =>
    el.classList.toggle('active', el.dataset.page === current));

  const note = NOTES[current] || { caption: '', points: [] };
  document.getElementById('caption').innerHTML = '<b>' + TITLES[current] + '</b> — ' + note.caption;
  document.getElementById('noteTitle').textContent = '📐 ' + TITLES[current] + ' · 设计说明';
  document.getElementById('notePoints').innerHTML = note.points.map(p => '<div class="note-point">' + p + '</div>').join('');
}

function submitRepair() {
  const t = document.getElementById('rpTitle').value.trim() || '新的报修工单';
  const d = document.getElementById('rpDesc').value.trim() || '（未填写描述）';
  repairs.unshift({ id: Date.now(), title: t, desc: d, status: '待处理', time: '2026-10-28 12:00', imgs: 0 });
  toast('报修提交成功');
  go('repair', true);
}
function payBill(id) {
  const b = bills.find(x => x.id === id);
  if (confirm('确认缴纳「' + b.type + '」¥' + b.money.toFixed(2) + ' 吗？')) {
    b.status = '已缴费';
    b.payTime = '2026-10-28 12:00';
    toast('缴费成功');
    rerender();
  }
}
function toggleLike(id) {
  const p = posts.find(x => x.id === id);
  p.liked = !p.liked;
  p.likes += p.liked ? 1 : -1;
  rerender();
}
function sendReply() {
  const v = document.getElementById('replyText').value.trim();
  if (!v) { toast('请输入回复内容'); return; }
  posts.find(x => x.id === currentPostId).replies.push({ user: USER.name, content: v });
  toast('回复成功');
  rerender();
}
function submitPost() {
  const t = document.getElementById('ptTitle').value.trim() || '新帖子';
  const c = document.getElementById('ptContent').value.trim() || '（未填写内容）';
  posts.unshift({ id: Date.now(), user: USER.name, title: t, content: c, likes: 0, liked: false, time: '2026-10-28 12:00', replies: [] });
  toast('发布成功');
  go('forum', true);
}
function toggleAct(id) {
  const a = activities.find(x => x.id === id);
  a.signed = !a.signed;
  a.count += a.signed ? 1 : -1;
  toast(a.signed ? '报名成功' : '已取消报名');
  rerender();
}
function submitDeco() {
  const d = document.getElementById('dcDate').value;
  const c = document.getElementById('dcContent').value.trim() || '（未填写说明）';
  decorations.unshift({ id: Date.now(), date: d, content: c, status: '待审批' });
  toast('申请已提交，等待物业审批');
  rerender();
}
function submitFeedback() {
  const c = document.getElementById('fbContent').value.trim();
  if (!c) { toast('请输入反馈内容'); return; }
  feedbacks.unshift({ id: Date.now(), content: c, reply: '', status: '待回复', time: '2026-10-28 12:00' });
  toast('反馈已提交');
  rerender();
}
function saveProfile() {
  USER.room = document.getElementById('pfRoom').value.trim() || USER.room;
  USER.phone = document.getElementById('pfPhone').value.trim() || USER.phone;
  toast('资料已保存');
  go('mine', true);
}

/* ==================== 初始化 ==================== */
document.getElementById('navTree').innerHTML = TREE.map(g => `
  <div class="group-name">${g.group}</div>
  ${g.items.map(it => `<div class="nav-item" data-page="${it.id}"><span class="dot"></span>${it.name}</div>`).join('')}
`).join('');
document.querySelectorAll('.side-left .nav-item').forEach(el => {
  el.onclick = () => go(el.dataset.page, TAB_PAGES.includes(el.dataset.page) || el.dataset.page === 'login');
});
document.querySelectorAll('.tab-item').forEach(el => {
  el.onclick = () => go(el.dataset.page, true);
});

go('login', true);
</script>
</body>
</html>
